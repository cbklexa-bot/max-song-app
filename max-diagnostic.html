<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MAX Diagnostic</title>
  <style>
    body{margin:0;padding:20px;font-family:system-ui,sans-serif;background:#0d0718;color:#fff}
    h1{font-size:22px;margin:0 0 16px}
    .row{padding:12px;margin:8px 0;border:1px solid #3b2a52;border-radius:12px;background:#170d24}
    .ok{color:#59e6b8}.bad{color:#ff727d}.mono{font-family:monospace;word-break:break-all}
    pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#cdbfe0}
  </style>
</head>
<body>
  <h1>MAX Diagnostic</h1>
  <div id="out"></div>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script>
    const out=document.getElementById('out');
    const row=(name,value,ok)=>{
      const d=document.createElement('div');
      d.className='row';
      d.innerHTML='<b>'+name+'</b><div class="'+(ok?'ok':'bad')+' mono">'+String(value)+'</div>';
      out.appendChild(d);
    };
    function run(){
      const w=window.WebApp;
      row('window.WebApp',!!w,!!w);
      if(!w){row('RESULT','MAX Bridge is NOT available',false);return;}
      const init=String(w.initData||'');
      const user=w.initDataUnsafe?.user||null;
      row('initData length',init.length,init.length>0);
      row('user id',user?.id||'нет',!!user?.id);
      row('platform',w.platform||'unknown',true);
      row('version',w.version||'unknown',true);
      row('deviceName',w.deviceName||'unknown',true);
      row('document URL',location.href,true);
      const pre=document.createElement('pre');
      pre.textContent=init ? 'initData prefix: '+init.slice(0,120)+'…' : 'initData empty';
      out.appendChild(pre);
    }
    setTimeout(run,300);
  </script>
</body>
</html>
