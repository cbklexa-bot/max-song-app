<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Песня на заказ | MAX</title>

  <!--
    MAX Bridge.

    defer:
    HTML и интерфейс больше не блокируются
    ожиданием загрузки внешней JS-библиотеки.
  -->
  <script
    defer
    src="https://st.max.ru/js/max-web-app.js"
    onload="window.__MAX_BRIDGE_SCRIPT_LOADED__ = true"
    onerror="window.__MAX_BRIDGE_SCRIPT_ERROR__ = true"
  ></script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(30, 41, 59, 0.72);
      --panel-dark: #0b1220;
      --panel-soft: rgba(15, 23, 42, 0.85);
      --border: rgba(100, 116, 139, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
      --muted-2: #64748b;
      --purple: #9333ea;
      --purple-2: #7e22ce;
      --pink: #db2777;
      --green: #10b981;
      --amber: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(126, 34, 206, 0.16),
          transparent 36%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(16px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .startup-status {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.1);
      color: #fde68a;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .startup-status.visible {
      display: block;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .header-card {
      padding: 12px;
      margin-bottom: 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .profile {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 50%;
      background:
        linear-gradient(
          135deg,
          #9333ea,
          #db2777
        );
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: 800;
    }

    .profile-text {
      min-width: 0;
    }

    .profile-name {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .balance-button {
      flex-shrink: 0;
      padding: 7px 9px;
      border-radius: 13px;
      border: 1px solid rgba(147, 51, 234, 0.42);
      background: rgba(2, 6, 23, 0.82);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-value {
      color: #34d399;
      font-size: 12px;
      font-weight: 800;
    }

    .balance-plus {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #9333ea;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 900;
    }

    .main-card,
    .orders-card {
      padding: 16px;
      margin-bottom: 14px;
    }

    .hero {
      text-align: center;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 247, 0.2);
      background: rgba(168, 85, 247, 0.1);
      color: #c084fc;
      font-size: 10px;
      font-weight: 700;
    }

    .hero h1 {
      margin: 7px 0 0;
      font-size: 25px;
      line-height: 1.1;
      font-weight: 900;
      background:
        linear-gradient(
          90deg,
          #c084fc,
          #ec4899
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      gap: 7px;
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .choice-button {
      min-height: 38px;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: rgba(51, 65, 85, 0.48);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease;
    }

    .choice-button:active {
      transform: scale(0.98);
    }

    .choice-button.selected {
      background: #9333ea;
      border-color: #c084fc;
      color: white;
    }

    .prompt {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border-radius: 13px;
      border: 1px solid #334155;
      background: rgba(2, 6, 23, 0.82);
      color: #e2e8f0;
      padding: 11px;
      font-size: 12px;
      line-height: 1.45;
      outline: none;
    }

    .prompt::placeholder {
      color: #64748b;
    }

    .prompt:focus {
      border-color: #9333ea;
    }

    .generate-button {
      width: 100%;
      min-height: 48px;
      padding: 11px 14px;
      border-radius: 14px;
      color: white;
      background:
        linear-gradient(
          90deg,
          #9333ea,
          #db2777
        );
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 10px 26px rgba(147, 51, 234, 0.24);
    }

    .generate-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .orders-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 900;
      color: #e2e8f0;
    }

    .empty {
      padding: 16px 8px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }

    .order-card {
      padding: 13px;
      margin-bottom: 10px;
      border-radius: 15px;
      border: 1px solid rgba(100, 116, 139, 0.28);
      background: rgba(2, 6, 23, 0.73);
    }

    .order-card:last-child {
      margin-bottom: 0;
    }

    .processing {
      border-color: rgba(168, 85, 247, 0.45);
    }

    .preview {
      border-color: rgba(245, 158, 11, 0.5);
    }

    .completed {
      border-color: rgba(100, 116, 139, 0.35);
    }

    .order-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .order-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .order-icon.processing-icon {
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .order-icon.completed-icon {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .order-info {
      min-width: 0;
      flex: 1;
    }

    .order-name {
      margin: 0;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .order-meta {
      margin: 3px 0 0;
      color: #94a3b8;
      font-size: 10px;
    }

    .phrase {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      color: #fcd34d;
      font-size: 11px;
      font-weight: 700;
    }

    .phrase-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .preview-label {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 7px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.25);
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
      font-size: 9px;
      font-weight: 900;
    }

    .preview-description {
      margin: 0 0 10px;
      color: #cbd5e1;
      font-size: 11px;
    }

    .variant {
      padding: 10px;
      margin-top: 8px;
      border-radius: 11px;
      border: 1px solid #1e293b;
      background: #020617;
    }

    .variant-title {
      margin-bottom: 6px;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 800;
    }

    audio {
      width: 100%;
      height: 38px;
      display: block;
    }

    .variant-button {
      width: 100%;
      margin-top: 7px;
      padding: 9px;
      border-radius: 10px;
      background: #059669;
      color: white;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .audio-block {
      margin-top: 10px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 9px;
    }

    .secondary-button {
      padding: 9px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-small {
      background: rgba(126, 34, 206, 0.85);
      border-color: rgba(168, 85, 247, 0.25);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 18px;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
    }

    .modal.visible {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      border-radius: 24px;
      border: 1px solid #334155;
      background: #0f172a;
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      font-weight: 900;
    }

    .modal-title {
      margin: 0 45px 3px 0;
      font-size: 16px;
      font-weight: 900;
    }

    .modal-subtitle {
      margin: 0 0 15px;
      color: #94a3b8;
      font-size: 11px;
    }

    .amounts {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .amount-button {
      padding: 11px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }

    .amount-button.selected {
      border-color: rgba(168, 85, 247, 0.65);
      background: rgba(126, 34, 206, 0.15);
    }

    .bonus {
      margin-left: 5px;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 900;
    }

    .bonus-green {
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
      background: rgba(16, 185, 129, 0.1);
    }

    .bonus-amber {
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.25);
      background: rgba(245, 158, 11, 0.1);
    }

    .credit-box {
      margin-bottom: 14px;
      padding: 11px;
      border-radius: 11px;
      border: 1px solid #1e293b;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
    }

    .credit-label {
      color: #94a3b8;
    }

    .credit-value {
      color: #34d399;
      font-size: 14px;
      font-weight: 900;
    }

    .pay-button {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      color: white;
      background:
        linear-gradient(
          90deg,
          #10b981,
          #0d9488
        );
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .loading {
      opacity: 0.55;
      pointer-events: none;
    }

    @media (max-width: 400px) {
      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div
      id="startup-status"
      class="startup-status"
    ></div>

    <!-- HEADER -->

    <div class="card header-card">

      <div class="profile">

        <div
          id="user-avatar"
          class="avatar"
        >
          M
        </div>

        <div class="profile-text">

          <h2
            id="user-name"
            class="profile-name"
          >
            Загрузка...
          </h2>

          <p class="profile-subtitle">
            MAX Account
          </p>

        </div>

      </div>

      <button
        id="balance-button"
        class="balance-button"
        type="button"
      >

        <span
          id="user-balance"
          class="balance-value"
        >
          0 ₽
        </span>

        <span class="balance-plus">
          +
        </span>

      </button>

    </div>

    <!-- MAIN -->

    <div class="card main-card">

      <div class="hero">

        <span class="badge">
          AI Студия музыки
        </span>

        <h1>
          Песня на заказ
        </h1>

      </div>

      <!-- GENRE -->

      <div class="section">

        <span class="section-label">
          🎵 Жанр музыки
        </span>

        <div
          id="genre-select"
          class="grid grid-3"
        >

          <button
            class="choice-button selected"
            data-genre="Поп"
            type="button"
          >
            Поп
          </button>

          <button
            class="choice-button"
            data-genre="Танцевальная"
            type="button"
          >
            Танцевальная
          </button>

          <button
            class="choice-button"
            data-genre="Народная"
            type="button"
          >
            Народная
          </button>

          <button
            class="choice-button"
            data-genre="Шансон"
            type="button"
          >
            Шансон
          </button>

          <button
            class="choice-button"
            data-genre="Рэп"
            type="button"
          >
            Рэп
          </button>

          <button
            class="choice-button"
            data-genre="Рок"
            type="button"
          >
            Рок
          </button>

          <button
            class="choice-button"
            data-genre="Акустика"
            type="button"
          >
            Акустика
          </button>

          <button
            class="choice-button"
            data-genre="Джаз"
            type="button"
          >
            Джаз
          </button>

          <button
            class="choice-button"
            data-genre="Электроника"
            type="button"
          >
            Электроника
          </button>

        </div>

      </div>

      <!-- VOCAL -->

      <div class="section">

        <span class="section-label">
          🎙 Исполнение / Вокал
        </span>

        <div
          id="vocal-select"
          class="grid grid-2"
        >

          <button
            class="choice-button selected"
            data-vocal="Мужской соло"
            type="button"
          >
            Мужской соло
          </button>

          <button
            class="choice-button"
            data-vocal="Женский соло"
            type="button"
          >
            Женский соло
          </button>

          <button
            class="choice-button"
            data-vocal="Дуэт"
            type="button"
          >
            Дуэт
          </button>

          <button
            class="choice-button"
            data-vocal="Хор"
            type="button"
          >
            Хор
          </button>

          <button
            class="choice-button"
            data-vocal="Детский голос"
            type="button"
          >
            Детский голос
          </button>

        </div>

      </div>

      <!-- PROMPT -->

      <div class="section">

        <label
          class="section-label"
          for="prompt-input"
        >
          💬 Детали и пожелания к песне
        </label>

        <textarea
          id="prompt-input"
          class="prompt"
          rows="4"
          maxlength="2000"
          placeholder="Имя человека, праздник, ключевые фразы..."
        ></textarea>

      </div>

      <button
        id="order-btn"
        class="generate-button"
        type="button"
      >
        Сгенерировать шедевр
      </button>

    </div>

    <!-- ORDERS -->

    <div class="card orders-card">

      <h2 class="orders-title">
        🎧 Мои песни
      </h2>

      <div id="orders-list">

        <div class="empty">
          У вас пока нет сгенерированных песен.
        </div>

      </div>

    </div>

  </div>

  <!-- TOPUP MODAL -->

  <div
    id="topup-modal"
    class="modal"
  >

    <div class="modal-box">

      <button
        id="topup-close"
        class="modal-close"
        type="button"
      >
        ✕
      </button>

      <h3 class="modal-title">
        Пополнение баланса
      </h3>

      <p class="modal-subtitle">
        Минимальная сумма пополнения — 200 ₽
      </p>

      <div class="amounts">

        <button
          class="amount-button selected"
          data-amount="200"
          type="button"
        >

          <span>
            200 ₽
          </span>

          <span>
            Стандарт (1 песня)
          </span>

        </button>

        <button
          class="amount-button"
          data-amount="400"
          type="button"
        >

          <span>
            400 ₽
            <span class="bonus bonus-green">
              +10% БОНУС
            </span>
          </span>

          <span>
            +40 ₽
          </span>

        </button>

        <button
          class="amount-button"
          data-amount="800"
          type="button"
        >

          <span>
            800 ₽
            <span class="bonus bonus-amber">
              +20% БОНУС
            </span>
          </span>

          <span>
            +160 ₽
          </span>

        </button>

      </div>

      <div class="credit-box">

        <span class="credit-label">
          Будет зачислено:
        </span>

        <span
          id="modal-credited-calc"
          class="credit-value"
        >
          200 ₽
        </span>

      </div>

      <button
        id="process-topup-button"
        class="pay-button"
        type="button"
      >
        Оплатить и пополнить
      </button>

    </div>

  </div>

  <script>
    /*
     * ========================================================
     * APPLICATION STATE
     * ========================================================
     */

    const API_BASE = '';

    let selectedGenre = 'Поп';
    let selectedVocal = 'Мужской соло';

    let currentMaxId = '';
    let currentUserName = '';
    let currentBalance = 0;
    let maxInitData = '';

    let selectedTopupSum = 200;

    let phraseIndex = 0;
    let phraseTimer = null;
    let pollTimer = null;

    const GENERATION_PHRASES = [
      '✨ AI пишет 2 варианта текста...',
      '🎵 Сочиняем 2 разные мелодии...',
      '🎤 Записываем нейро-вокал...',
      '🎧 Сводим и создаем демо...',
      '🚀 Готовим треки к прослушиванию...'
    ];

    /*
     * ========================================================
     * UI HELPERS
     * ========================================================
     */

    function showStartupError(message) {
      const box =
        document.getElementById(
          'startup-status'
        );

      box.textContent = String(message);

      box.classList.add('visible');
    }

    function clearStartupError() {
      const box =
        document.getElementById(
          'startup-status'
        );

      box.classList.remove('visible');
      box.textContent = '';
    }

    function showTemporaryStatus(message) {
      const box =
        document.getElementById(
          'startup-status'
        );

      box.textContent = String(message);
      box.classList.add('visible');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    /*
     * Для inline data внутри HTML.
     */
    function safeJsString(value) {
      return JSON.stringify(
        String(value ?? '')
      )
        .replaceAll('\\', '\\\\')
        .replaceAll("'", "\\'");
    }

    /*
     * ========================================================
     * API
     * ========================================================
     */

    async function apiFetch(
      path,
      options = {},
      timeoutMs = 25000
    ) {
      const controller =
        new AbortController();

      const timeoutId =
        setTimeout(
          () => controller.abort(),
          timeoutMs
        );

      try {
        const headers =
          new Headers(
            options.headers || {}
          );

        headers.set(
          'Content-Type',
          'application/json'
        );

        const finalOptions = {
          ...options,
          headers,
          signal: controller.signal
        };

        const response =
          await fetch(
            `${API_BASE}${path}`,
            finalOptions
          );

        const text =
          await response.text();

        let data = {};

        try {
          data =
            text
              ? JSON.parse(text)
              : {};
        } catch {
          throw new Error(
            `Сервер вернул не JSON ` +
            `(${response.status}): ` +
            `${text.slice(0, 200)}`
          );
        }

        if (!response.ok) {
          throw new Error(
            data.message ||
            `Ошибка HTTP ${response.status}`
          );
        }

        return data;

      } catch (err) {

        if (
          err?.name ===
          'AbortError'
        ) {
          throw new Error(
            'Сервер слишком долго отвечает. ' +
            'Попробуйте ещё раз.'
          );
        }

        throw err;

      } finally {
        clearTimeout(timeoutId);
      }
    }

     * ========================================================

    async function loadOrders() {
      try {

        const data =
          await apiFetch(
            '/api/orders',
            {
              method: 'POST',
              body: JSON.stringify({
                initData:
                  maxInitData
              })
            }
          );

        if (
          data.success
        ) {

          const validOrders =
            (
              data.orders || []
            ).filter(
              order =>
                order.status !==
                'failed'
            );

          renderOrders(
            validOrders
          );

          const hasProcessing =
            validOrders.some(
              order =>
                order.status ===
                'processing'
            );

          if (hasProcessing) {

            startPhraseAnimation();

            scheduleNextPoll();

          } else {

            stopPhraseAnimation();

          }
        }

      } catch (err) {

        console.error(
          '[ORDERS]',
          err
        );

        /*
         * Не показываем ошибку
         * вместо интерфейса.
         */
      }
    }

    function scheduleNextPoll() {
      if (pollTimer) {
        clearTimeout(
          pollTimer
        );
      }

      pollTimer =
        setTimeout(
          async () => {

            pollTimer = null;

            await loadOrders();

          },
          4000
        );
    }

    function startPhraseAnimation() {
      if (phraseTimer) {
        return;
      }

      phraseTimer =
        setInterval(
          () => {

            phraseIndex =
              (
                phraseIndex + 1
              ) %
              GENERATION_PHRASES.length;

            document
              .querySelectorAll(
                '.dynamic-phrase'
              )
              .forEach(
                el => {
                  el.textContent =
                    GENERATION_PHRASES[
                      phraseIndex
                    ];
                }
              );

          },
          3000
        );
    }

    function stopPhraseAnimation() {
      if (phraseTimer) {

        clearInterval(
          phraseTimer
        );

        phraseTimer = null;
      }
    }

    /*
     * ========================================================
     * DOWNLOAD
     * ========================================================
     */

    function downloadSongFile(
      audioUrl,
      songTitle
    ) {
      const safeName =
        String(
          songTitle || 'song'
        )
          .replace(
            /[\\/:*?"<>|]/g,
            '_'
          );

      const webApp =
        getMaxWebApp();

      if (
        webApp?.downloadFile &&
        /^https:\/\//i.test(
          audioUrl
        )
      ) {

        try {

          webApp.downloadFile(
            audioUrl,
            `${safeName}.mp3`
          );

          return;

        } catch (err) {

          console.warn(
            '[MAX DOWNLOAD FALLBACK]',
            err
          );
        }
      }

      const downloadUrl =
        `${API_BASE}/api/download` +
        `?url=${encodeURIComponent(
          audioUrl
        )}` +
        `&name=${encodeURIComponent(
          safeName
        )}`;

      const a =
        document.createElement(
          'a'
        );

      a.href = downloadUrl;

      a.download =
        `${safeName}.mp3`;

      document.body.appendChild(a);

      a.click();

      document.body.removeChild(a);
    }

    /*
     * ========================================================
     * SHARE
     * ========================================================
     */

    async function shareSong(
      url
    ) {
      try {

        const webApp =
          getMaxWebApp();

        if (
          webApp?.shareContent
        ) {

          await webApp.shareContent({
            link: url,
            text:
              'Моя новая песня на заказ 🎵'
          });

          return;
        }

        if (
          navigator.share
        ) {

          await navigator.share({
            title:
              'Моя новая песня на заказ',
            url
          });

          return;
        }

        if (
          navigator.clipboard
        ) {

          await navigator.clipboard
            .writeText(url);

          alert(
            'Ссылка скопирована!'
          );
        }

      } catch (err) {

        console.warn(
          '[SHARE]',
          err
        );
      }
    }

    async function generateSong() {
      const prompt =
        document
          .getElementById(
            'prompt-input'
          )
          .value
          .trim();

      if (!prompt) {
        alert(
          'Пожалуйста, напишите ' +
          'пожелания к песне!'
        );

        return;
      }

      if (
        currentBalance < 200
      ) {

        alert(
          'Для генерации необходимо ' +
          'минимум 200 ₽. ' +
          'Пополните баланс.'
        );

        openTopupModal();

        return;
      }

      const button =
        document.getElementById(
          'order-btn'
        );

      button.disabled = true;

      button.textContent =
        'Отправка заказа...';

      try {

        const data =
          await apiFetch(
            '/api/generate-song',
            {
              method: 'POST',
              body: JSON.stringify({
                initData:
                  maxInitData,
                genre:
                  selectedGenre,
                vocal:
                  selectedVocal,
                prompt
              })
            },
            30000
          );

        if (data.success) {

          document.getElementById(
            'prompt-input'
          ).value = '';

          await loadOrders();

        } else {

          alert(
            data.message ||
            'Не удалось запустить генерацию.'
          );

        }

      } catch (err) {

        console.error(
          '[GENERATE]',
          err
        );

        alert(
          err.message ||
          'Ошибка связи с сервером.'
        );

      } finally {

        button.disabled = false;

        button.textContent =
          'Сгенерировать шедевр';
      }
    }

    /*
     * ========================================================
     * EVENTS
     * ========================================================
     */

    function setupEvents() {

      /*
       * GENRE
       */

      document
        .querySelectorAll(
          '[data-genre]'
        )
        .forEach(
          button => {

            button.addEventListener(
              'click',
              () => {

                selectedGenre =
                  button.dataset.genre;

                document
                  .querySelectorAll(
                    '[data-genre]'
                  )
                  .forEach(
                    item =>
                      item.classList.remove(
                        'selected'
                      )
                  );

                button.classList.add(
                  'selected'
                );

                try {

                  getMaxWebApp()
                    ?.HapticFeedback
                    ?.selectionChanged
                    ?.();

                } catch {}
              }
            );
          }
        );

      /*
       * VOCAL
       */

      document
        .querySelectorAll(
          '[data-vocal]'
        )
        .forEach(
          button => {

            button.addEventListener(
              'click',
              () => {

                selectedVocal =
                  button.dataset.vocal;

                document
                  .querySelectorAll(
                    '[data-vocal]'
                  )
                  .forEach(
                    item =>
                      item.classList.remove(
                        'selected'
                      )
                  );

                button.classList.add(
                  'selected'
                );

                try {

                  getMaxWebApp()
                    ?.HapticFeedback
                    ?.selectionChanged
                    ?.();

                } catch {}
              }
            );
          }
        );

      /*
       * TOPUP
       */

      document
        .getElementById(
          'balance-button'
        )
        .addEventListener(
          'click',
          openTopupModal
        );

      document
        .getElementById(
          'topup-close'
        )
        .addEventListener(
          'click',
          closeTopupModal
        );

      document
        .querySelectorAll(
          '[data-amount]'
        )
        .forEach(
          button => {

            button.addEventListener(
              'click',
              () => {

                selectTopupAmount(
                  Number(
                    button.dataset.amount
                  ),
                  button
                );
              }
            );
          }
        );

      document
        .getElementById(
          'process-topup-button'
        )
        .addEventListener(
          'click',
          processTopup
        );

      /*
       * GENERATE
       */

      document
        .getElementById(
          'order-btn'
        )
        .addEventListener(
          'click',
          generateSong
        );

      /*
       * EVENT DELEGATION
       */

      document
        .getElementById(
          'orders-list'
        )
        .addEventListener(
          'click',
          async event => {

            const target =
              event.target
                ?.closest(
                  'button'
                );

            if (!target) {
              return;
            }

            /*
             * UNLOCK
             */

            if (
              target.dataset
                .unlock === 'true'
            ) {

              await unlockSong(
                Number(
                  target.dataset.orderId
                ),
                Number(
                  target.dataset.option
                ),
                target.dataset.url,
                target.dataset.title
              );

              return;
            }

            /*
             * DOWNLOAD
             */

            if (
              target.dataset
                .download === 'true'
            ) {

              downloadSongFile(
                target.dataset.url,
                target.dataset.title
              );

              return;
            }

            /*
             * SHARE
             */

            if (
              target.dataset
                .share === 'true'
            ) {

              await shareSong(
                target.dataset.url
              );
            }
          }
        );

      /*
       * DEMO AUDIO
       */

      document
        .getElementById(
          'orders-list'
        )
        .addEventListener(
          'timeupdate',
          event => {

            const audio =
              event.target;

            if (
              audio.matches(
                '[data-demo-audio="true"]'
              )
            ) {

              handleDemoTimeUpdate(
                audio
              );
            }
          },
          true
        );
    }

        );

        /*
         * MAX Bridge загружается через defer.
         *
         * deferred script будет выполнен
         * до DOMContentLoaded.
         */

        if (!window.WebApp) {

          const detail =
            window.__MAX_BRIDGE_SCRIPT_ERROR__
              ? 'MAX Bridge вернул ошибку загрузки.'
              : 'MAX Bridge ещё не доступен.';

          throw new Error(
            detail +
            ' Попробуйте открыть Mini App ещё раз.'
          );
        }

        console.log(
          '[MAX] Bridge ready'
        );

        /*
         * Получаем и валидируем initData.
         */

        await fetchUserData();

        console.log(
          '[APP] Mini App initialized'
        );

      } catch (err) {

        console.error(
          '[INIT]',
          err
        );

        showStartupError(
          err.message ||
          'Не удалось запустить Mini App.'
        );
      }
    }

    /*
     * ========================================================
     * GLOBAL ERROR LOGGING
     * ========================================================
     */

    window.addEventListener(
      'error',
      event => {

        console.error(
          '[GLOBAL ERROR]',
          event.error ||
          event.message
        );
      }
    );

    window.addEventListener(
      'unhandledrejection',
      event => {

        console.error(
          '[UNHANDLED PROMISE]',
          event.reason
        );
      }
    );

    /*
     * ========================================================
     * START
     * ========================================================
     */

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        setupEvents();

        initMiniApp();
      }
    );
  </script>

</body>
</html>
