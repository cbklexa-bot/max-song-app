<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Песня на заказ | MAX Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body class="flex flex-col justify-between p-2 max-w-md mx-auto select-none h-screen">

  <!-- Шапка пользователя -->
  <div class="w-full bg-slate-800/90 rounded-xl px-3 py-2 flex justify-between items-center border border-slate-700 shadow-md shrink-0">
    <div class="flex items-center gap-2.5 overflow-hidden">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center font-bold text-white text-xs shrink-0" id="user-avatar">
        M
      </div>
      <div class="truncate">
        <h2 class="font-bold text-xs text-slate-100 truncate leading-tight" id="user-name">Загрузка...</h2>
        <p class="text-[10px] text-slate-400">MAX Account</p>
      </div>
    </div>
    
    <!-- Кнопка баланса и пополнения -->
    <div onclick="openTopupModal()" class="cursor-pointer bg-slate-900 hover:bg-slate-950 border border-purple-500/40 px-3 py-1 rounded-lg flex items-center gap-2 transition active:scale-95 shrink-0">
      <span class="font-bold text-emerald-400 text-xs" id="user-balance">0 ₽</span>
      <div class="w-4 h-4 bg-purple-600 rounded-full flex items-center justify-center text-white text-[10px] font-bold shadow">
        +
      </div>
    </div>
  </div>

  <!-- Главный контейнер заказа (компактный) -->
  <div class="w-full bg-slate-800/60 rounded-2xl p-3 border border-slate-700/80 shadow-xl backdrop-blur shrink-0 my-1">
    
    <div class="text-center mb-2">
      <h1 class="text-sm font-black bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent leading-tight">
        Песня на заказ
      </h1>
      <p class="text-[10px] text-slate-400">2 варианта • Демо 30 сек бесплатно</p>
    </div>

    <!-- Выбор жанра -->
    <div class="mb-2">
      <label class="block text-[10px] font-semibold text-slate-300 mb-1">🎵 Жанр музыки</label>
      <div class="grid grid-cols-3 gap-1" id="genre-select">
        <button onclick="selectGenre(this, 'Поп')" class="genre-btn bg-purple-600 border-purple-400 text-white py-1 px-1 rounded-lg text-[11px] font-medium border transition">Поп</button>
        <button onclick="selectGenre(this, 'Танцевальная')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[11px] font-medium border transition">Танцевальная</button>
        <button onclick="selectGenre(this, 'Народная')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[11px] font-medium border transition">Народная</button>
        <button onclick="selectGenre(this, 'Шансон')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[11px] font-medium border transition">Шансон</button>
        <button onclick="selectGenre(this, 'Рок')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[11px] font-medium border transition">Рок</button>
        <button onclick="selectGenre(this, 'Рэп')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[11px] font-medium border transition">Рэп</button>
      </div>
    </div>

    <!-- Выбор вокала -->
    <div class="mb-2">
      <label class="block text-[10px] font-semibold text-slate-300 mb-1">🎙 Вокал</label>
      <div class="grid grid-cols-4 gap-1" id="vocal-select">
        <button onclick="selectVocal(this, 'Мужской соло')" class="vocal-btn bg-purple-600 border-purple-400 text-white py-1 px-1 rounded-lg text-[10px] font-medium border transition">Мужской</button>
        <button onclick="selectVocal(this, 'Женский соло')" class="vocal-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[10px] font-medium border transition">Женский</button>
        <button onclick="selectVocal(this, 'Дуэт')" class="vocal-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[10px] font-medium border transition">Дуэт</button>
        <button onclick="selectVocal(this, 'Хор')" class="vocal-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[10px] font-medium border transition">Хор</button>
      </div>
    </div>

    <!-- Пожелания -->
    <div class="mb-2.5">
      <textarea id="prompt-input" rows="2" placeholder="Имя, повод, ключевые фразы..." class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 transition resize-none"></textarea>
    </div>

    <!-- Кнопка заказа -->
    <button id="order-btn" onclick="generateSong()" class="w-full bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-bold py-2 px-3 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-2">
      <span>Сгенерировать 2 варианта (200 ₽)</span>
    </button>

  </div>

  <!-- Раздел: Мои песни (со внутренней прокруткой, не ломающей экран) -->
  <div class="w-full bg-slate-800/40 rounded-2xl p-2.5 border border-slate-700/60 flex-1 flex flex-col min-h-0 overflow-hidden mb-1">
    <h2 class="text-xs font-bold mb-1.5 text-slate-300 flex items-center gap-1.5 shrink-0">
      🎧 Мои песни
    </h2>
    <div id="orders-list" class="space-y-2 overflow-y-auto flex-1 pr-1">
      <p class="text-[11px] text-slate-500 text-center py-4">Список песен пуст</p>
    </div>
  </div>

  <!-- Модальное окно пополнения баланса (с бонусами и деталями) -->
  <div id="topup-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-4 shadow-2xl relative">
      <button onclick="closeTopupModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white font-bold text-sm">✕</button>
      
      <h3 class="text-base font-bold text-slate-100 mb-1">Пополнение баланса</h3>
      <p class="text-[11px] text-slate-400 mb-3">Минимальная сумма — 200 ₽</p>

      <!-- Выбор суммы с бонусами -->
      <div class="space-y-2 mb-3">
        <button onclick="selectTopupAmount(200)" id="btn-amt-200" class="amount-btn w-full bg-slate-800 border border-purple-500 p-2.5 rounded-xl flex justify-between items-center text-xs font-semibold transition">
          <span>200 ₽</span>
          <span class="text-slate-400 text-[10px]">Стандарт (1 песня)</span>
        </button>

        <button onclick="selectTopupAmount(400)" id="btn-amt-400" class="amount-btn w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl flex justify-between items-center text-xs font-semibold transition">
          <div class="flex items-center gap-2">
            <span>400 ₽</span>
            <span class="bg-emerald-500/20 text-emerald-400 text-[9px] px-1.5 py-0.5 rounded border border-emerald-500/30">+10% БОНУС</span>
          </div>
          <span class="text-emerald-400 text-[10px]">+40 ₽ в подарок</span>
        </button>

        <button onclick="selectTopupAmount(800)" id="btn-amt-800" class="amount-btn w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl flex justify-between items-center text-xs font-semibold transition">
          <div class="flex items-center gap-2">
            <span>800 ₽</span>
            <span class="bg-amber-500/20 text-amber-400 text-[9px] px-1.5 py-0.5 rounded border border-amber-500/30">+20% БОНУС</span>
          </div>
          <span class="text-amber-400 text-[10px]">+160 ₽ в подарок</span>
        </button>
      </div>

      <!-- Итоговое зачисление -->
      <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 mb-3 flex justify-between items-center text-xs">
        <span class="text-slate-400">Будет зачислено на счет:</span>
        <span class="font-bold text-emerald-400 text-sm" id="modal-credited-calc">200 ₽</span>
      </div>

      <button onclick="processTopup()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-lg transition">
        Оплатить и пополнить
      </button>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://max-song-app.onrender.com';
    
    let selectedGenre = 'Поп';
    let selectedVocal = 'Мужской соло';
    let currentMaxId = '';
    let currentUserName = '';
    let currentBalance = 0;

    let selectedTopupSum = 200;
    
    let phraseIndex = 0;
    let phraseTimer = null;
    let pollTimer = null;

    const GENERATION_PHRASES = [
      "✨ AI пишет 2 варианта...",
      "🎵 Сочиняем мелодии...",
      "🎤 Записываем вокал...",
      "🎧 Сводим демо-версии..."
    ];

    function startPhraseAnimation() {
      if (phraseTimer) return;
      phraseTimer = setInterval(() => {
        phraseIndex = (phraseIndex + 1) % GENERATION_PHRASES.length;
        document.querySelectorAll('.dynamic-phrase').forEach(el => {
          el.innerText = GENERATION_PHRASES[phraseIndex];
        });
      }, 3000);
    }

    function stopPhraseAnimation() {
      if (phraseTimer) {
        clearInterval(phraseTimer);
        phraseTimer = null;
      }
    }

    function detectUser() {
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const getParam = (key) => urlParams.get(key) || hashParams.get(key);

      const urlMaxId = getParam('max_id') || getParam('user_id') || getParam('id');
      const urlName = getParam('name') || getParam('first_name');

      const maxUser = 
        window.WebApp?.initDataUnsafe?.user || 
        window.MAXWebApp?.initDataUnsafe?.user || 
        window.MaxApp?.initDataUnsafe?.user ||
        window.max?.initDataUnsafe?.user ||
        window.Telegram?.WebApp?.initDataUnsafe?.user;

      if (maxUser && maxUser.id) {
        currentMaxId = String(maxUser.id);
        currentUserName = maxUser.first_name || maxUser.name || 'Пользователь Max';
      } else if (urlMaxId) {
        currentMaxId = String(urlMaxId);
        currentUserName = urlName ? decodeURIComponent(urlName) : 'Пользователь Max';
      } else {
        let savedGuestId = localStorage.getItem('max_guest_id');
        if (!savedGuestId) {
          savedGuestId = 'guest_' + Math.random().toString(36).substring(2, 11);
          localStorage.setItem('max_guest_id', savedGuestId);
        }
        currentMaxId = savedGuestId;
        currentUserName = 'Гость Max';
      }

      document.getElementById('user-name').innerText = currentUserName;
      document.getElementById('user-avatar').innerText = currentUserName.charAt(0).toUpperCase();
    }

    async function fetchUserData() {
      detectUser();
      try {
        const res = await fetch(`${BACKEND_URL}/api/user/${currentMaxId}?name=${encodeURIComponent(currentUserName)}`);
        const data = await res.json();
        if (data.success) {
          currentBalance = Number(data.user.balance || 0);
          document.getElementById('user-balance').innerText = `${currentBalance} ₽`;
        }
      } catch (err) {
        console.error('Ошибка профиля:', err);
      }
      loadOrders();
    }

    function openTopupModal() { 
      document.getElementById('topup-modal').classList.remove('hidden'); 
    }
    
    function closeTopupModal() { 
      document.getElementById('topup-modal').classList.add('hidden'); 
    }

    function selectTopupAmount(amount) {
      selectedTopupSum = amount;
      
      document.querySelectorAll('.amount-btn').forEach(b => {
        b.className = 'amount-btn w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl flex justify-between items-center text-xs font-semibold transition';
      });
      
      const activeBtn = document.getElementById(`btn-amt-${amount}`);
      if (activeBtn) {
        activeBtn.className = 'amount-btn w-full bg-slate-800 border border-purple-500 p-2.5 rounded-xl flex justify-between items-center text-xs font-semibold transition';
      }

      let total = amount;
      if (amount === 400) total = 440;
      if (amount === 800) total = 960;
      document.getElementById('modal-credited-calc').innerText = `${total} ₽`;
    }

    async function processTopup() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/topup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maxId: currentMaxId, amount: selectedTopupSum })
        });
        const data = await res.json();
        if (data.success) {
          currentBalance = Number(data.newBalance);
          document.getElementById('user-balance').innerText = `${currentBalance} ₽`;
          alert(data.message);
          closeTopupModal();
        } else {
          alert('Ошибка: ' + data.message);
        }
      } catch (e) {
        alert('Ошибка сервера.');
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/orders/${currentMaxId}`);
        const data = await res.json();
        if (data.success) {
          const validOrders = (data.orders || []).filter(o => o.status !== 'failed');
          renderOrders(validOrders);

          if (validOrders.some(o => o.status === 'processing')) {
            startPhraseAnimation();
            if (!pollTimer) pollTimer = setTimeout(loadOrders, 4000);
          } else {
            stopPhraseAnimation();
            if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
          }
        }
      } catch (err) {
        console.error('Ошибка заказов:', err);
      }
    }

    function handleDemoTimeUpdate(audioEl) {
      if (audioEl.currentTime >= 30) {
        audioEl.pause();
        audioEl.currentTime = 0;
        alert("⌛ Демо-прослушивание 30 сек. Разблокируйте полную версию!");
      }
    }

    async function unlockSong(orderId, optionIndex, audioUrl, title) {
      if (currentBalance < 200) {
        alert('Недостаточно средств. Пополните баланс на 200 ₽.');
        openTopupModal();
        return;
      }
      if (!confirm(`Разблокировать "${title}" за 200 ₽?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/unlock-song`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maxId: currentMaxId, orderId, selectedOption: optionIndex, audioUrl, title })
        });
        const data = await res.json();
        if (data.success) {
          currentBalance = Number(data.newBalance);
          document.getElementById('user-balance').innerText = `${currentBalance} ₽`;
          alert('🎉 Успешно разблокировано!');
          loadOrders();
        } else {
          alert('Ошибка: ' + data.message);
        }
      } catch (e) {
        alert('Ошибка связи.');
      }
    }

    function renderOrders(orders) {
      const listContainer = document.getElementById('orders-list');
      if (!orders || orders.length === 0) {
        listContainer.innerHTML = '<p class="text-[11px] text-slate-500 text-center py-4">Список песен пуст</p>';
        return;
      }

      listContainer.innerHTML = '';
      orders.forEach(order => {
        const card = document.createElement('div');

        if (order.status === 'processing') {
          card.className = 'bg-slate-900 border border-purple-500/40 rounded-xl p-2.5 space-y-2 shrink-0';
          card.innerHTML = `
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 rounded-lg bg-purple-600/30 flex items-center justify-center text-purple-300 text-xs font-bold animate-spin">⏳</div>
              <div>
                <h3 class="text-xs font-bold text-purple-300">Создаем варианты...</h3>
                <p class="text-[10px] text-slate-400">${order.genre} • ${order.vocal}</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <div class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></div>
              <span class="dynamic-phrase text-[10px] font-medium text-amber-300">${GENERATION_PHRASES[phraseIndex]}</span>
            </div>
          `;
        } else if (order.status === 'preview') {
          card.className = 'bg-slate-900 border border-amber-500/40 rounded-xl p-2.5 space-y-2 shrink-0';
          card.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-800 pb-1">
              <span class="bg-amber-500/20 text-amber-300 text-[9px] font-bold px-1.5 py-0.5 rounded border border-amber-500/30">ДЕМО (30 сек)</span>
              <span class="text-[10px] text-slate-400">${order.genre}</span>
            </div>
            <div class="space-y-1">
              <div class="flex items-center justify-between text-[11px] font-semibold text-slate-200">
                <span>🎵 Вариант 1</span>
                <button onclick="unlockSong(${order.id}, 1, '${order.audio_url}', '${order.title || 'Вариант 1'}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1 px-2 rounded text-[10px]">Скачать (200 ₽)</button>
              </div>
              <audio ontimeupdate="handleDemoTimeUpdate(this)" controls class="w-full h-7 rounded border border-slate-800 bg-slate-950">
                <source src="${order.audio_url}" type="audio/mpeg">
              </audio>
            </div>
            ${order.audio_url_2 ? `
            <div class="space-y-1 pt-1 border-t border-slate-800/60">
              <div class="flex items-center justify-between text-[11px] font-semibold text-slate-200">
                <span>🎵 Вариант 2</span>
                <button onclick="unlockSong(${order.id}, 2, '${order.audio_url_2}', '${order.title_2 || 'Вариант 2'}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1 px-2 rounded text-[10px]">Скачать (200 ₽)</button>
              </div>
              <audio ontimeupdate="handleDemoTimeUpdate(this)" controls class="w-full h-7 rounded border border-slate-800 bg-slate-950">
                <source src="${order.audio_url_2}" type="audio/mpeg">
              </audio>
            </div>
            ` : ''}
          `;
        } else if (order.status === 'completed' && order.audio_url) {
          card.className = 'bg-slate-900 border border-slate-700/80 rounded-xl p-2.5 space-y-1.5 shrink-0';
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 overflow-hidden">
                <div class="w-6 h-6 rounded-lg bg-emerald-600/20 flex items-center justify-center text-emerald-400 font-bold text-xs shrink-0">🎵</div>
                <div class="truncate">
                  <h3 class="text-xs font-bold text-slate-100 truncate">${order.title || 'Песня'}</h3>
                  <p class="text-[10px] text-slate-400">${order.genre}</p>
                </div>
              </div>
              <a href="${order.audio_url}" target="_blank" download="song.mp3" class="bg-purple-600 hover:bg-purple-500 text-white text-[10px] font-semibold py-1 px-2 rounded-lg shrink-0">📥 Скачать</a>
            </div>
            <audio controls class="w-full h-7 rounded border border-slate-800 bg-slate-950">
              <source src="${order.audio_url}" type="audio/mpeg">
            </audio>
          `;
        }
        listContainer.appendChild(card);
      });
    }

    function selectGenre(btn, genre) {
      document.querySelectorAll('.genre-btn').forEach(b => b.className = 'genre-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[11px] font-medium border transition');
      btn.className = 'genre-btn bg-purple-600 border-purple-400 text-white py-1 px-1 rounded-lg text-[11px] font-medium border transition';
      selectedGenre = genre;
    }

    function selectVocal(btn, vocal) {
      document.querySelectorAll('.vocal-btn').forEach(b => b.className = 'vocal-btn bg-slate-700/50 border-slate-600 text-slate-300 py-1 px-1 rounded-lg text-[10px] font-medium border transition');
      btn.className = 'vocal-btn bg-purple-600 border-purple-400 text-white py-1 px-1 rounded-lg text-[10px] font-medium border transition';
      selectedVocal = vocal;
    }

    async function generateSong() {
      const prompt = document.getElementById('prompt-input').value.trim();
      if (!prompt) {
        alert('Введите пожелания к песне!');
        return;
      }
      if (currentBalance < 200) {
        alert('Необходимо минимум 200 ₽. Пополните баланс.');
        openTopupModal();
        return;
      }

      const btn = document.getElementById('order-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>Отправка...</span>`;

      try {
        const res = await fetch(`${BACKEND_URL}/api/generate-song`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maxId: currentMaxId, genre: selectedGenre, vocal: selectedVocal, prompt })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('prompt-input').value = '';
          await loadOrders();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Ошибка сервера.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Сгенерировать 2 варианта (200 ₽)</span>`;
      }
    }

    fetchUserData();
  </script>
</body>
</html>
