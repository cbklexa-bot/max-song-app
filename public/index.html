<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Песня на заказ | MAX Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Официальная библиотека MAX Bridge для связи с мессенджером -->
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

  <!-- Шапка пользователя -->
  <div class="w-full max-w-md bg-slate-800/80 rounded-2xl p-4 mb-3 flex justify-between items-center border border-slate-700 shadow-lg backdrop-blur">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center font-bold text-white text-lg" id="user-avatar">
        M
      </div>
      <div>
        <h2 class="font-bold text-sm text-slate-100" id="user-name">Загрузка...</h2>
        <p class="text-xs text-slate-400">MAX Account</p>
      </div>
    </div>
    
    <!-- Кнопка баланса и пополнения -->
    <div onclick="openTopupModal()" class="cursor-pointer bg-slate-900 hover:bg-slate-950 border border-purple-500/40 px-3 py-1.5 rounded-xl flex items-center gap-2 transition active:scale-95 shadow-md">
      <span class="font-bold text-emerald-400 text-sm" id="user-balance">0 ₽</span>
      <div class="w-5 h-5 bg-purple-600 hover:bg-purple-500 rounded-full flex items-center justify-center text-white text-xs font-bold shadow">
        +
      </div>
    </div>
  </div>

  <!-- Отладочная строка для проверки ID -->
  <div class="w-full max-w-md text-[10px] text-slate-500 mb-4 px-2 flex justify-between">
    <span id="debug-info">ID: инициализация...</span>
    <span class="text-purple-400 cursor-pointer" onclick="forceChangeUser()">[Сменить ID]</span>
  </div>

  <!-- Главный контейнер заказа -->
  <div class="w-full max-w-md bg-slate-800/50 rounded-3xl p-6 border border-slate-700 shadow-2xl backdrop-blur mb-6">
    
    <div class="text-center mb-6">
      <span class="bg-purple-500/10 text-purple-400 text-xs font-semibold px-3 py-1 rounded-full border border-purple-500/20">
        AI Студия музыки
      </span>
      <h1 class="text-2xl font-black mt-2 bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
        Песня на заказ
      </h1>
      <p class="text-xs text-slate-400 mt-1">2 уникальных варианта • Демо 30 сек бесплатно</p>
    </div>

    <!-- Выбор жанра -->
    <div class="mb-5">
      <label class="block text-xs font-semibold text-slate-300 mb-2">🎵 Жанр музыки</label>
      <div class="grid grid-cols-3 gap-2" id="genre-select">
        <button onclick="selectGenre(this, 'Поп')" class="genre-btn bg-purple-600 border-purple-400 text-white p-2.5 rounded-xl text-xs font-medium border transition">Поп</button>
        <button onclick="selectGenre(this, 'Танцевальная')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Танцевальная</button>
        <button onclick="selectGenre(this, 'Народная')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Народная</button>
        
        <button onclick="selectGenre(this, 'Шансон')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Шансон</button>
        <button onclick="selectGenre(this, 'Рок')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Рок</button>
        <button onclick="selectGenre(this, 'Рэп')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Рэп</button>
        
        <button onclick="selectGenre(this, 'Акустика')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Акустика</button>
        <button onclick="selectGenre(this, 'Джаз')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Джаз</button>
        <button onclick="selectGenre(this, 'Электроника')" class="genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Электроника</button>
      </div>
    </div>

    <!-- Выбор вокала -->
    <div class="mb-5">
      <label class="block text-xs font-semibold text-slate-300 mb-2">🎙 Исполнение / Вокал</label>
      <div class="grid grid-cols-2 gap-2" id="vocal-select">
        <button onclick="selectVocal(this, 'Мужской соло')" class="vocal-btn bg-purple-600 border-purple-400 text-white p-2.5 rounded-xl text-xs font-medium border transition">Мужской соло</button>
        <button onclick="selectVocal(this, 'Женский соло')" class="vocal-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Женский соло</button>
        <button onclick="selectVocal(this, 'Дуэт')" class="vocal-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Дуэт</button>
        <button onclick="selectVocal(this, 'Хор')" class="vocal-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition">Хор</button>
      </div>
    </div>

    <!-- Текст / Описание -->
    <div class="mb-6">
      <label class="block text-xs font-semibold text-slate-300 mb-2">💬 Детали и пожелания к песне</label>
      <textarea id="prompt-input" rows="3" placeholder="Имя человека, праздник, ключевые фразы..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 transition resize-none"></textarea>
    </div>

    <!-- Кнопка заказа -->
    <button id="order-btn" onclick="generateSong()" class="w-full bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-lg shadow-purple-500/25 active:scale-98 transition flex items-center justify-center gap-2">
      <span>Сгенерировать 2 варианта</span>
    </button>

  </div>

  <!-- Раздел: Мои песни -->
  <div class="w-full max-w-md bg-slate-800/50 rounded-3xl p-6 border border-slate-700 shadow-2xl backdrop-blur">
    <h2 class="text-lg font-bold mb-4 text-slate-200 flex items-center gap-2">
      🎧 Мои песни
    </h2>
    <div id="orders-list" class="space-y-4">
      <p class="text-xs text-slate-500 text-center py-4">У вас пока нет сгенерированных песен.</p>
    </div>
  </div>

  <!-- Модальное окно пополнения баланса -->
  <div id="topup-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-3xl p-6 shadow-2xl relative">
      <button onclick="closeTopupModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-lg">✕</button>
      
      <h3 class="text-lg font-bold text-slate-100 mb-1">Пополнение баланса</h3>
      <p class="text-xs text-slate-400 mb-4">Минимальная сумма пополнения — 200 ₽</p>

      <!-- Выбор суммы с бонусами -->
      <div class="space-y-2.5 mb-5">
        <button onclick="selectTopupAmount(200)" class="amount-btn w-full bg-slate-800 border border-purple-500/50 p-3 rounded-xl flex justify-between items-center text-xs font-semibold hover:border-purple-400 transition">
          <span>200 ₽</span>
          <span class="text-slate-400">Стандарт (1 песня)</span>
        </button>

        <button onclick="selectTopupAmount(400)" class="amount-btn w-full bg-slate-800 border border-slate-700 p-3 rounded-xl flex justify-between items-center text-xs font-semibold hover:border-purple-400 transition">
          <div class="flex items-center gap-2">
            <span>400 ₽</span>
            <span class="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-0.5 rounded-md border border-emerald-500/30">+10% БОНУС</span>
          </div>
          <span class="text-emerald-400">+40 ₽ в подарок</span>
        </button>

        <button onclick="selectTopupAmount(800)" class="amount-btn w-full bg-slate-800 border border-slate-700 p-3 rounded-xl flex justify-between items-center text-xs font-semibold hover:border-purple-400 transition">
          <div class="flex items-center gap-2">
            <span>800 ₽</span>
            <span class="bg-amber-500/20 text-amber-400 text-[10px] px-2 py-0.5 rounded-md border border-amber-500/30">+20% БОНУС</span>
          </div>
          <span class="text-amber-400">+160 ₽ в подарок</span>
        </button>
      </div>

      <!-- Итоговое зачисление -->
      <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-5 flex justify-between items-center text-xs">
        <span class="text-slate-400">Будет зачислено:</span>
        <span class="font-bold text-emerald-400 text-sm" id="modal-credited-calc">200 ₽</span>
      </div>

      <button onclick="processTopup()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition">
        Оплатить и пополнить
      </button>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://max-song-app.onrender.com';
    
    let selectedGenre = 'Поп';
    let selectedVocal = 'Мужской соло';
    let currentMaxId = '';
    let currentUserName = '';
    let currentBalance = 0;

    let selectedTopupSum = 200;
    let hasActiveGen = false;

    let phraseIndex = 0;
    let phraseTimer = null;
    let pollTimer = null;

    const GENERATION_PHRASES = [
      "✨ AI пишет 2 варианта текста...",
      "🎵 Сочиняем 2 разные мелодии...",
      "🎤 Записываем нейро-вокал...",
      "🎧 Сводим и создаем Демо...",
      "🚀 Готовим треки к прослушиванию..."
    ];

    function startPhraseAnimation() {
      if (phraseTimer) return;
      phraseTimer = setInterval(() => {
        phraseIndex = (phraseIndex + 1) % GENERATION_PHRASES.length;
        document.querySelectorAll('.dynamic-phrase').forEach(el => {
          el.innerText = GENERATION_PHRASES[phraseIndex];
        });
      }, 3000);
    }

    function stopPhraseAnimation() {
      if (phraseTimer) {
        clearInterval(phraseTimer);
        phraseTimer = null;
      }
    }

    function detectUser() {
      // Собираем параметры из URL строки и из хэша
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));

      const getParam = (key) => urlParams.get(key) || hashParams.get(key);

      const urlMaxId = getParam('max_id') || getParam('user_id') || getParam('id') || getParam('tgWebAppStartParam');
      const urlName = getParam('name') || getParam('first_name');

      // Проверяем официальный объект MAX Bridge (window.WebApp)
      const maxUser = 
        window.WebApp?.initDataUnsafe?.user || 
        window.MAXWebApp?.initDataUnsafe?.user || 
        window.MaxApp?.initDataUnsafe?.user ||
        window.max?.initDataUnsafe?.user ||
        window.Max?.initDataUnsafe?.user ||
        window.Telegram?.WebApp?.initDataUnsafe?.user;

      if (maxUser && maxUser.id) {
        currentMaxId = String(maxUser.id);
        currentUserName = maxUser.first_name || maxUser.name || 'Пользователь Max';
        document.getElementById('debug-info').innerText = `ID (Max Bridge): ${currentMaxId}`;
      } else if (urlMaxId) {
        currentMaxId = String(urlMaxId);
        currentUserName = urlName ? decodeURIComponent(urlName) : 'Пользователь Max';
        document.getElementById('debug-info').innerText = `ID (URL Param): ${currentMaxId}`;
      } else {
        // Если запущено вне мессенджера
        let savedGuestId = localStorage.getItem('max_guest_id');
        if (!savedGuestId) {
          savedGuestId = 'guest_' + Math.random().toString(36).substring(2, 11);
          localStorage.setItem('max_guest_id', savedGuestId);
        }
        currentMaxId = savedGuestId;
        currentUserName = 'Гость (Браузер)';
        document.getElementById('debug-info').innerText = `ID (Браузер): ${currentMaxId}`;
      }

      document.getElementById('user-name').innerText = currentUserName;
      document.getElementById('user-avatar').innerText = currentUserName.charAt(0).toUpperCase();
    }

    function forceChangeUser() {
      const newId = prompt("Служебная ручная смена ID:", currentMaxId);
      if (newId) {
        currentMaxId = newId.trim();
        localStorage.setItem('max_guest_id', currentMaxId);
        location.reload();
      }
    }

    async function fetchUserData() {
      detectUser();
      try {
        const res = await fetch(`${BACKEND_URL}/api/user/${currentMaxId}?name=${encodeURIComponent(currentUserName)}`);
        const data = await res.json();
        if (data.success) {
          currentBalance = Number(data.user.balance || 0);
          hasActiveGen = data.hasActiveGeneration;
          document.getElementById('user-balance').innerText = `${currentBalance} ₽`;
        }
      } catch (err) {
        console.error('Ошибка загрузки профиля:', err);
      }
      loadOrders();
    }

    function openTopupModal() {
      document.getElementById('topup-modal').classList.remove('hidden');
    }

    function closeTopupModal() {
      document.getElementById('topup-modal').classList.add('hidden');
    }

    function selectTopupAmount(amount) {
      selectedTopupSum = amount;
      let total = amount;
      if (amount === 400) total = 440;
      if (amount === 800) total = 960;
      document.getElementById('modal-credited-calc').innerText = `${total} ₽`;
    }

    async function processTopup() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/topup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maxId: currentMaxId, amount: selectedTopupSum })
        });
        const data = await res.json();
        if (data.success) {
          currentBalance = Number(data.newBalance);
          document.getElementById('user-balance').innerText = `${currentBalance} ₽`;
          alert(data.message);
          closeTopupModal();
        } else {
          alert('Ошибка: ' + data.message);
        }
      } catch (e) {
        alert('Ошибка сервера при пополнении.');
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/orders/${currentMaxId}`);
        const data = await res.json();

        if (data.success) {
          const validOrders = (data.orders || []).filter(o => o.status !== 'failed');
          renderOrders(validOrders);

          const hasProcessing = validOrders.some(o => o.status === 'processing');
          if (hasProcessing) {
            startPhraseAnimation();
            scheduleNextPoll();
          } else {
            stopPhraseAnimation();
          }
        }
      } catch (err) {
        console.error('Ошибка загрузки заказов:', err);
      }
    }

    function scheduleNextPoll() {
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = setTimeout(async () => {
        pollTimer = null;
        await loadOrders();
      }, 4000);
    }

    function handleDemoTimeUpdate(audioEl) {
      if (audioEl.currentTime >= 30) {
        audioEl.pause();
        audioEl.currentTime = 0;
        alert("⌛ Демо-прослушивание ограничено 30 секундами. Разблокируйте полную версию за 200 ₽!");
      }
    }

    async function unlockSong(orderId, optionIndex, audioUrl, title) {
      if (currentBalance < 200) {
        alert('Недостаточно средств на балансе! Пополните баланс на 200 ₽.');
        openTopupModal();
        return;
      }

      if (!confirm(`Разблокировать полную версию (${title}) за 200 ₽?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/unlock-song`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            maxId: currentMaxId,
            orderId: orderId,
            selectedOption: optionIndex,
            audioUrl: audioUrl,
            title: title
          })
        });

        const data = await res.json();
        if (data.success) {
          currentBalance = Number(data.newBalance);
          document.getElementById('user-balance').innerText = `${currentBalance} ₽`;
          alert('🎉 Песня успешно разблокирована!');
          hasActiveGen = false;
          loadOrders();
        } else {
          alert('Ошибка: ' + data.message);
        }
      } catch (e) {
        alert('Ошибка связи с сервером.');
      }
    }

    function renderOrders(orders) {
      const listContainer = document.getElementById('orders-list');
      if (!orders || orders.length === 0) {
        listContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">У вас пока нет сгенерированных песен.</p>';
        return;
      }

      listContainer.innerHTML = '';

      orders.forEach(order => {
        const card = document.createElement('div');

        if (order.status === 'processing') {
          card.className = 'bg-slate-900/90 border border-purple-500/40 rounded-2xl p-4 space-y-3';
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-purple-600/30 border border-purple-500/50 flex items-center justify-center text-purple-300 text-lg font-bold animate-spin">
                ⏳
              </div>
              <div>
                <h3 class="text-sm font-bold text-purple-300">Генерируем 2 варианта...</h3>
                <p class="text-xs text-slate-400">${order.genre} • ${order.vocal}</p>
              </div>
            </div>
            <div class="flex items-center gap-2 pt-1">
              <div class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></div>
              <span class="dynamic-phrase text-xs font-medium text-amber-300">${GENERATION_PHRASES[phraseIndex]}</span>
            </div>
          `;
        } else if (order.status === 'preview') {
          card.className = 'bg-slate-900/90 border border-amber-500/50 rounded-2xl p-4 space-y-4';
          card.innerHTML = `
            <div class="border-b border-slate-800 pb-2">
              <span class="bg-amber-500/20 text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded border border-amber-500/30">
                ДЕМО-РЕЖИМ (30 сек)
              </span>
              <p class="text-xs text-slate-300 mt-1">Послушайте варианты и разблокируйте полную версию:</p>
            </div>

            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
              <div class="flex justify-between items-center text-xs font-bold text-slate-200">
                <span>🎵 Вариант 1</span>
              </div>
              <audio ontimeupdate="handleDemoTimeUpdate(this)" controls class="w-full h-8 rounded border border-slate-800">
                <source src="${order.audio_url}" type="audio/mpeg">
              </audio>
              <button onclick="unlockSong(${order.id}, 1, '${order.audio_url}', '${order.title || 'Вариант 1'}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition">
                Скачать полную версию (200 ₽)
              </button>
            </div>

            ${order.audio_url_2 ? `
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
              <div class="flex justify-between items-center text-xs font-bold text-slate-200">
                <span>🎵 Вариант 2</span>
              </div>
              <audio ontimeupdate="handleDemoTimeUpdate(this)" controls class="w-full h-8 rounded border border-slate-800">
                <source src="${order.audio_url_2}" type="audio/mpeg">
              </audio>
              <button onclick="unlockSong(${order.id}, 2, '${order.audio_url_2}', '${order.title_2 || 'Вариант 2'}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition">
                Скачать полную версию (200 ₽)
              </button>
            </div>
            ` : ''}
          `;
        } else if (order.status === 'completed' && order.audio_url) {
          card.className = 'bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4 space-y-3';
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold">
                🎵
              </div>
              <div class="flex-1 overflow-hidden">
                <h3 class="text-sm font-bold text-slate-100 truncate">${order.title || 'Именная песня'}</h3>
                <p class="text-xs text-slate-400">${order.genre} • ${order.vocal}</p>
              </div>
            </div>

            <audio controls class="w-full h-9 rounded-lg border border-slate-700 bg-slate-950">
              <source src="${order.audio_url}" type="audio/mpeg">
            </audio>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <a href="${order.audio_url}" target="_blank" download="song.mp3" class="bg-purple-600/80 hover:bg-purple-600 text-white text-xs font-semibold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition">
                📥 Скачать MP3
              </a>
              <button onclick="shareSong('${order.audio_url}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-xs font-semibold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition">
                📤 Поделиться
              </button>
            </div>
          `;
        }

        listContainer.appendChild(card);
      });
    }

    function shareSong(url) {
      if (navigator.share) {
        navigator.share({ title: 'Моя новая песня на заказ', url: url });
      } else {
        navigator.clipboard.writeText(url);
        alert('Ссылка скопирована!');
      }
    }

    function selectGenre(btn, genre) {
      document.querySelectorAll('.genre-btn').forEach(b => {
        b.className = 'genre-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition';
      });
      btn.className = 'genre-btn bg-purple-600 border-purple-400 text-white p-2.5 rounded-xl text-xs font-medium border transition';
      selectedGenre = genre;
    }

    function selectVocal(btn, vocal) {
      document.querySelectorAll('.vocal-btn').forEach(b => {
        b.className = 'vocal-btn bg-slate-700/50 border-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium border hover:border-slate-500 transition';
      });
      btn.className = 'vocal-btn bg-purple-600 border-purple-400 text-white p-2.5 rounded-xl text-xs font-medium border transition';
      selectedVocal = vocal;
    }

    async function generateSong() {
      const prompt = document.getElementById('prompt-input').value.trim();
      if (!prompt) {
        alert('Пожалуйста, напишите пожелания к песне!');
        return;
      }

      if (currentBalance < 200) {
        alert(`Для генерации необходимо минимум 200 ₽. Пополните баланс.`);
        openTopupModal();
        return;
      }

      const btn = document.getElementById('order-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>Отправка заказа...</span>`;

      try {
        const res = await fetch(`${BACKEND_URL}/api/generate-song`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            maxId: currentMaxId,
            genre: selectedGenre,
            vocal: selectedVocal,
            prompt: prompt
          })
        });

        const data = await res.json();

        if (data.success) {
          document.getElementById('prompt-input').value = '';
          await loadOrders();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Ошибка связи с сервером.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Сгенерировать 2 варианта</span>`;
      }
    }

    // Автоматический старт при загрузке страницы
    fetchUserData();
  </script>
</body>
</html>
