name: Repair MAX API transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-max-api.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch API transport and MAX signature validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          old = """const API_BASE =
      location.hostname.endsWith('github.io')
        ? 'https://max-song-app.onrender.com'
        : '';"""
          new = """const API_BASE =
      'https://max-song-app.onrender.com';"""
          if old in text:
              text = text.replace(old, new, 1)

          old = """    async function apiFetch(
      path,
      options = {},
      timeoutMs = 30000
    ) {
      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          timeoutMs
        );

      try {

        const headers =
          new Headers(
            options.headers || {}
          );

        headers.set(
          'X-MAX-Init-Data',
          maxInitData
        );

        /*
         * JSON нужен только для методов,
         * у которых реально есть body.
         */

        if (
          options.body &&
          !headers.has(
            'Content-Type'
          )
        ) {
          headers.set(
            'Content-Type',
            'application/json'
          );
        }

        const response =
          await fetch(
            `${API_BASE}${path}`,
            {
              ...options,
              headers,
              signal:
                controller.signal
            }
          );"""

          new = """    async function apiFetch(
      path,
      options = {},
      timeoutMs = 30000
    ) {
      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          timeoutMs
        );

      try {

        const headers =
          new Headers(
            options.headers || {}
          );

        headers.delete(
          'X-MAX-Init-Data'
        );

        let requestUrl =
          `${API_BASE}${path}`;

        let requestBody =
          options.body;

        if (options.body) {
          try {
            const payload =
              JSON.parse(options.body);

            const form =
              new URLSearchParams();

            Object.entries(
              payload || {}
            ).forEach(
              ([key, value]) => {
                form.set(
                  key,
                  String(value ?? '')
                );
              }
            );

            form.set(
              'initData',
              maxInitData
            );

            requestBody = form;

          } catch {
            requestBody =
              options.body;
          }

        } else {

          requestUrl +=
            `${requestUrl.includes('?') ? '&' : '?'}initData=${encodeURIComponent(maxInitData)}`;
        }

        const response =
          await fetch(
            requestUrl,
            {
              ...options,
              body: requestBody,
              headers,
              signal:
                controller.signal
            }
          );"""

          if old in text:
              text = text.replace(old, new, 1)
          else:
              print('apiFetch legacy block already patched or not found')

          index.write_text(text, encoding='utf-8')

          server = Path('server.js')
          s = server.read_text(encoding='utf-8')

          start = s.index('function validateMaxInitData(initData) {')
          end = s.index('\nfunction requireMaxUser(req) {', start)

          validation = r'''function validateMaxInitData(initData) {
  if (!MAX_BOT_TOKEN) {
    throw new Error('MAX_BOT_TOKEN is not configured');
  }

  if (!initData || typeof initData !== 'string') {
    throw new Error('MAX initData is missing');
  }

  const pairs = [];

  for (const part of initData.split('&')) {
    const separatorIndex = part.indexOf('=');

    if (separatorIndex === -1) {
      continue;
    }

    const key = part.slice(0, separatorIndex);
    const rawValue = part.slice(separatorIndex + 1);

    if (pairs.some(([existingKey]) => existingKey === key)) {
      throw new Error('MAX initData contains duplicate parameters');
    }

    let value;
    try {
      value = decodeURIComponent(rawValue);
    } catch (_) {
      throw new Error('MAX initData contains invalid URL encoding');
    }

    pairs.push([key, value]);
  }

  const hashEntries = pairs.filter(([key]) => key === 'hash');

  if (hashEntries.length !== 1) {
    throw new Error('MAX initData hash is missing or duplicated');
  }

  const receivedHash = hashEntries[0][1];

  const dataCheckString = pairs
    .filter(([key]) => key !== 'hash')
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([key, value]) => key + '=' + value)
    .join('\n');

  const secretKey = crypto
    .createHmac('sha256', 'WebAppData')
    .update(MAX_BOT_TOKEN)
    .digest();

  const calculatedHash = crypto
    .createHmac('sha256', secretKey)
    .update(dataCheckString)
    .digest('hex');

  const receivedBuffer = Buffer.from(receivedHash, 'hex');
  const calculatedBuffer = Buffer.from(calculatedHash, 'hex');

  if (
    receivedBuffer.length !== calculatedBuffer.length ||
    !crypto.timingSafeEqual(receivedBuffer, calculatedBuffer)
  ) {
    throw new Error('Invalid MAX initData signature');
  }

  if (pairs.some(([key]) => key === 'auth_date')) {
    const authDateValue = pairs.find(([key]) => key === 'auth_date')[1];
    const authDate = Number(authDateValue);

    if (!Number.isNaN(authDate)) {
      const ageSeconds = Math.floor(Date.now() / 1000) - authDate;

      if (ageSeconds > 3600) {
        throw new Error('MAX initData expired');
      }
    }
  }

  let user = null;
  const userValue = pairs.find(([key]) => key === 'user')?.[1];

  if (userValue) {
    try {
      user = JSON.parse(userValue);
    } catch (_) {
      user = null;
    }
  }

  return {
    params: Object.fromEntries(pairs),
    user
  };
}
'''

          s = s[:start] + validation + s[end:]

          old = """function requireMaxUser(req) {
  const initData = req.headers['x-max-init-data'];

  if (!initData) {
    throw new Error('X-MAX-Init-Data header is missing');
  }

  const result = validateMaxInitData(initData);"""
          new = """function requireMaxUser(req) {
  const initData =
    req.headers['x-max-init-data'] ||
    req.query.initData ||
    req.body?.initData ||
    '';

  if (!initData) {
    throw new Error('MAX initData is missing');
  }

  const result = validateMaxInitData(initData);"""
          if old in s:
              s = s.replace(old, new, 1)

          server.write_text(s, encoding='utf-8')

          bootstrap = Path('max-bootstrap.js')
          b = bootstrap.read_text(encoding='utf-8')

          b = re.sub(
              r"\n// MAX initData compatibility for the existing signature implementation\..*?(?=\n// On Amvera, force the existing HTML)",
              "\n",
              b,
              flags=re.S
          )

          bootstrap.write_text(b, encoding='utf-8')
          PY

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html server.js max-bootstrap.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix MAX initData signature validation'
          git push origin main
