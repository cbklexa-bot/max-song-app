name: Repair MAX API transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-max-api.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch API transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = """const API_BASE =\n      location.hostname.endsWith('github.io')\n        ? 'https://max-song-app.onrender.com'\n        : '';"""
          new = """const API_BASE =\n      'https://max-song-app.onrender.com';"""
          if old not in text:
              raise SystemExit('Expected API_BASE block was not found in index.html')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          server = Path('server.js')
          text = server.read_text(encoding='utf-8')
          old = """app.use(\n  cors({\n    origin: [\n      'https://cbklexa-bot.github.io',\n      'https://max-song-app.onrender.com'\n    ],\n    methods: ['GET', 'POST', 'PATCH', 'OPTIONS'],\n    allowedHeaders: ['Content-Type', 'X-MAX-Init-Data'],\n    credentials: false\n  })\n);"""
          new = """app.use(\n  cors({\n    origin: true,\n    methods: ['GET', 'POST', 'PATCH', 'OPTIONS'],\n    allowedHeaders: ['Content-Type', 'X-MAX-Init-Data'],\n    credentials: false\n  })\n);"""
          if old not in text:
              raise SystemExit('Expected CORS block was not found in server.js')
          server.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html server.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix MAX API transport and CORS'
          git push origin main
