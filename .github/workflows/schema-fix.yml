name: Fix users table mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schema-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch server for current Supabase users schema
        shell: python
        run: |
          from pathlib import Path

          server = Path('server.js')
          text = server.read_text(encoding='utf-8')

          text = text.replace("max_user_id:", "max_id:")

          start = text.index('async function createUser(maxUser) {')
          end = text.index('\nasync function getOrCreateUser(maxUser) {', start)

          new_create_user = '''async function createUser(maxUser) {
  const fullName =
    [maxUser.first_name, maxUser.last_name]
      .filter(Boolean)
      .join(' ')
      .trim() ||
    maxUser.username ||
    'MAX пользователь';

  const body = {
    max_id: String(maxUser.id),
    name: fullName,
    balance: 0
  };

  const rows = await supabasePost('users', body);

  return rows[0];
}
'''

          text = text[:start] + new_create_user + text[end:]

          text = text.replace('user.id', 'user.max_id')
          text = text.replace(
              "id: 'eq.' + String(user.max_id)",
              "max_id: 'eq.' + String(user.max_id)"
          )

          server.write_text(text, encoding='utf-8')

      - name: Validate JavaScript syntax
        shell: bash
        run: node --check server.js

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Supabase users schema mapping'
          git push origin main
