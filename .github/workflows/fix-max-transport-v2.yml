name: Fix MAX transport v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-max-transport-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch MAX API transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          text = text.replace(
              "const API_BASE =\n      location.hostname.endsWith('github.io')\n        ? 'https://max-song-app.onrender.com'\n        : '';",
              "const API_BASE =\n      'https://max-song-app.onrender.com';",
              1,
          )

          api_fetch = r'''    async function apiFetch(
      path,
      options = {},
      timeoutMs = 30000
    ) {
      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          timeoutMs
        );

      try {
        const headers =
          new Headers(
            options.headers || {}
          );

        headers.delete(
          'X-MAX-Init-Data'
        );

        let requestUrl =
          `${API_BASE}${path}`;

        let requestBody =
          options.body;

        if (options.body) {
          try {
            const payload =
              JSON.parse(options.body);

            const form =
              new URLSearchParams();

            Object.entries(
              payload || {}
            ).forEach(
              ([key, value]) => {
                form.set(
                  key,
                  String(value ?? '')
                );
              }
            );

            form.set(
              'initData',
              maxInitData
            );

            requestBody = form;
          } catch {
            requestBody =
              options.body;
          }
        } else {
          requestUrl +=
            `${requestUrl.includes('?') ? '&' : '?'}initData=${encodeURIComponent(maxInitData)}`;
        }

        const response =
          await fetch(
            requestUrl,
            {
              ...options,
              body: requestBody,
              headers,
              signal:
                controller.signal
            }
          );

        const responseText =
          await response.text();

        let data = {};

        try {
          data = responseText
            ? JSON.parse(responseText)
            : {};
        } catch {
          throw new Error(
            `Сервер вернул не JSON (${response.status})`
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            `Ошибка HTTP ${response.status}`
          );
        }

        return data;
      } catch (error) {
        if (
          error?.name === 'AbortError'
        ) {
          throw new Error(
            'Сервер слишком долго отвечает.'
          );
        }

        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }
'''

          pattern = re.compile(
              r"    async function apiFetch\(.*?\n    /\* =========================================================\n       USER",
              re.S,
          )

          replacement = api_fetch + "    /* =========================================================\n       USER"
          text, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              raise SystemExit('apiFetch block was not found')

          index.write_text(text, encoding='utf-8')

          server = Path('server.js')
          s = server.read_text(encoding='utf-8')

          json_block = """app.use(
  express.json({
    limit: '1mb'
  })
);"""
          if "express.urlencoded" not in s:
              if json_block not in s:
                  raise SystemExit('express.json block was not found')
              s = s.replace(
                  json_block,
                  json_block + "\n\napp.use(\n  express.urlencoded({\n    extended: false,\n    limit: '1mb'\n  })\n);",
                  1,
              )

          req_pattern = re.compile(
              r"function requireMaxUser\(req\) \{.*?\n\}",
              re.S,
          )
          req_replacement = """function requireMaxUser(req) {
  const initData =
    req.headers['x-max-init-data'] ||
    req.query.initData ||
    req.body?.initData ||
    '';

  if (!initData) {
    throw new Error('MAX initData is missing');
  }

  const result = validateMaxInitData(initData);

  if (!result.user || !result.user.id) {
    throw new Error('MAX user data is missing');
  }

  return result;
}"""

          s, req_count = req_pattern.subn(
              req_replacement,
              s,
              count=1,
          )

          if req_count != 1:
              raise SystemExit('requireMaxUser block was not found')

          server.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html server.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix MAX API without preflight'
          git push origin main
