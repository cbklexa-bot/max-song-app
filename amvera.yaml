meta:
  environment: node
  toolchain:
    name: npm
    version: 18

run:
  command: node -r ./max-bootstrap.js -r ./robokassa-env-normalize.js -r ./robokassa-bootstrap.js -r ./robokassa-status.js -r ./robokassa-live-sbp.js -r ./robokassa-ui-direct.js server.js
  persistenceMount: /data
  containerPort: 10000
