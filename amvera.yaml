meta:
  environment: node
  toolchain:
    name: npm
    version: 18

run:
  command: node -r ./max-bootstrap.js -r ./robokassa-env-normalize.js -r ./robokassa-sbp-op.js -r ./robokassa-ui-direct.js -r ./ai-home-ui.js -r ./ai-home-account.js -r ./ai-home-visual.js -r ./ai-song-visual.js -r ./ai-navigation-visual.js server.js
  persistenceMount: /data
  containerPort: 10000
