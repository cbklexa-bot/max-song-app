meta:
  environment: node
  toolchain:
    name: npm
    version: 18

run:
  command: node -r ./max-bootstrap.js -r ./robokassa-env-normalize.js -r ./robokassa-sbp-op.js -r ./robokassa-ui-direct.js -r ./ai-home-ui.js -r ./ai-home-account.js -r ./ai-home-visual.js -r ./ai-song-visual.js -r ./ai-song-modern-ui.js -r ./ai-navigation-v2.js -r ./ai-gifts-v3.js -r ./ai-home-video-copy.js -r ./ai-gifts-final-visual.js -r ./ai-video-flow-ui.js -r ./ai-gifts-layout-polish.js -r ./ai-gifts-final-delivery.js server.js
  persistenceMount: /data
  containerPort: 10000
