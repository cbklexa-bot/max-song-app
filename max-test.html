<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MAX TEST</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111827;
      color: #ffffff;
      font-family:
        Arial,
        sans-serif;
    }

    body {
      padding: 24px;
      box-sizing: border-box;
    }

    .box {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;

      border-radius: 20px;

      background: #1f2937;

      border: 1px solid #374151;
    }

    h1 {
      margin-top: 0;
      color: #a78bfa;
    }

    .status {
      margin-top: 15px;
      padding: 15px;

      border-radius: 12px;

      background: #111827;

      word-break: break-word;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>MAX TEST</h1>

    <div id="status" class="status">
      HTML ЗАГРУЖЕН
    </div>

  </div>

</body>
</html>
