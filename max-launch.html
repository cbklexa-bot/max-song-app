<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Песня на заказ | MAX</title>
  <style>
    html,body{margin:0;padding:0;min-height:100%;background:#0d0718;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{padding:24px;display:flex;align-items:center;justify-content:center}
    .box{max-width:420px;text-align:center;color:#bdb3c5}
    .error{color:#ffb4bc;white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <div class="box" id="boot">Запускаем MAX Music Studio…</div>
  <script>
    (async () => {
      try {
        const API_BASE = 'https://max-song-app.onrender.com';
        const sourceUrl = 'index.html?max_transport=6&v=' + Date.now();
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('Не удалось загрузить приложение: HTTP ' + response.status);

        let html = await response.text();
        const start = html.indexOf('    async function apiFetch(');
        const marker = '    /* =========================================================\n       USER';
        const end = html.indexOf(marker, start);

        if (start < 0 || end < 0) {
          throw new Error('Не найден сетевой слой приложения.');
        }

        const replacement = `    async function apiFetch(
      path,
      options = {},
      timeoutMs = 30000
    ) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const url = new URL(\`${API_BASE}\${path}\`);
        const payload = options.body ? (() => {
          try { return JSON.parse(options.body); }
          catch { return {}; }
        })() : {};

        url.searchParams.set('initData', maxInitData);
        Object.entries(payload || {}).forEach(([key, value]) => {
          url.searchParams.set(key, String(value ?? ''));
        });

        const response = await fetch(url.toString(), {
          method: options.method || 'GET',
          signal: controller.signal
        });

        const text = await response.text();
        let data = {};
        try {
          data = text ? JSON.parse(text) : {};
        } catch {
          throw new Error(\`Сервер вернул не JSON (\${response.status})\`);
        }

        if (!response.ok) {
          throw new Error(data.error || data.message || \`Ошибка HTTP \${response.status}\`);
        }

        return data;
      } catch (error) {
        if (error?.name === 'AbortError') {
          throw new Error('Сервер слишком долго отвечает.');
        }
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

`;

        html = html.slice(0, start) + replacement + html.slice(end);

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('boot').className = 'box error';
        document.getElementById('boot').textContent = String(error?.message || error);
      }
    })();
  </script>
</body>
</html>
