<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Песня на заказ | MAX</title>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    html,body{margin:0;padding:0;min-height:100%;background:#0d0718;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{padding:24px;display:flex;align-items:center;justify-content:center}
    .box{max-width:420px;text-align:center;color:#bdb3c5}
    .error{color:#ffb4bc;white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <div class="box" id="boot">Подключаем MAX…</div>
  <script>
    (async () => {
      const boot = document.getElementById('boot');
      try {
        let ready = false;
        for (let i = 0; i < 100; i++) {
          if (window.WebApp && typeof window.WebApp.initData === 'string') {
            ready = true;
            break;
          }
          await new Promise(r => setTimeout(r, 100));
        }
        if (!ready) throw new Error('MAX Bridge не передал initData.');

        boot.textContent = 'Запускаем приложение…';
        const response = await fetch('index.html?max_transport=7&v=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Не удалось загрузить приложение: HTTP ' + response.status);
        let html = await response.text();

        const start = html.indexOf('    async function apiFetch(');
        const marker = '    /* =========================================================\n       USER';
        const end = html.indexOf(marker, start);
        if (start < 0 || end < 0) throw new Error('Не найден сетевой слой приложения.');

        const replacement = `    async function apiFetch(
      path,
      options = {},
      timeoutMs = 20000
    ) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const url = new URL('https://max-song-app.onrender.com' + path);
        const payload = options.body ? (() => {
          try { return JSON.parse(options.body); }
          catch { return {}; }
        })() : {};

        const initData = (window.WebApp && typeof window.WebApp.initData === 'string')
          ? window.WebApp.initData
          : '';
        if (!initData) throw new Error('MAX initData отсутствует.');

        url.searchParams.set('initData', initData);
        Object.entries(payload || {}).forEach(([key, value]) => {
          url.searchParams.set(key, String(value ?? ''));
        });

        const response = await fetch(url.toString(), {
          method: options.method || 'GET',
          signal: controller.signal
        });

        const text = await response.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; }
        catch { throw new Error('Сервер вернул не JSON (' + response.status + ')'); }

        if (!response.ok) {
          throw new Error(data.error || data.message || ('Ошибка HTTP ' + response.status));
        }
        return data;
      } catch (error) {
        if (error && error.name === 'AbortError') {
          throw new Error('Сервер слишком долго отвечает.');
        }
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

`;

        html = html.slice(0, start) + replacement + html.slice(end);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        boot.className = 'box error';
        boot.textContent = String((error && error.message) || error);
      }
    })();
  </script>
</body>
</html>
